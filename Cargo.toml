[package]
name = "bib-cli"
version = "0.2.0"
edition = "2024"
description = "A provider-neutral BibTeX reconciliation CLI with reviewable integrity markers"
license = "MIT"
repository = "https://github.com/EvoEvolver/bib"

[[bin]]
name = "bib"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_bibtex = "0.7"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.21"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
strip = true
lto = "thin"
